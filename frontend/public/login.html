<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Iniciar sesión | BALDERRAMA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="/css/dashboard.css?v=173" rel="stylesheet"/>
<script src="/js/theme.js?v=1"></script>
</head>
<body class="login-body">
<main class="login-shell">
  <section class="login-card" aria-label="Iniciar sesión">
    <img src="/img/Imagen2.png" alt="Chevrolet Balderrama" class="login-logo"/>

    <form id="loginForm" class="login-form" autocomplete="on">
      <label class="login-field">
        <span class="sr-only">Usuario</span>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="Usuario"/>
      </label>
      <label class="login-field">
        <span class="sr-only">Contraseña</span>
        <div class="login-password-wrap">
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Contraseña"/>
          <button type="button" class="login-password-toggle" id="btnTogglePassword" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña">
            <span class="material-symbols-outlined" data-password-icon>visibility</span>
          </button>
        </div>
      </label>
      <p id="loginError" class="login-error hidden" role="alert"></p>
      <p id="loginSuccess" class="login-success hidden" role="status"></p>
      <button type="submit" class="login-submit" id="btnLogin">
        <span>Ingresar</span>
      </button>
      <button type="button" class="login-text-btn" id="btnForgot">¿Olvidaste tu contraseña?</button>
    </form>

    <form id="resetForm" class="login-form hidden" autocomplete="off">
      <h2 class="login-panel-title">Restablecer contraseña</h2>
      <p class="login-lead">Administración te comparte el código.</p>
      <label class="login-field">
        <span class="sr-only">Usuario</span>
        <input type="text" id="resetUsername" name="resetUsername" required autocomplete="username" placeholder="Usuario"/>
      </label>
      <button type="button" class="login-submit login-submit--ghost" id="btnRequestCode">
        <span>Enviar código</span>
      </button>
      <p id="resetInfo" class="login-success hidden" role="status"></p>
      <label class="login-field">
        <span class="sr-only">Código de 6 dígitos</span>
        <input type="text" id="resetCode" name="resetCode" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="Código de 6 dígitos"/>
      </label>
      <label class="login-field">
        <span class="sr-only">Nueva contraseña</span>
        <div class="login-password-wrap">
          <input type="password" id="resetPassword" name="resetPassword" autocomplete="new-password" minlength="8" placeholder="Nueva contraseña"/>
          <button type="button" class="login-password-toggle" id="btnToggleResetPassword" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña">
            <span class="material-symbols-outlined" data-reset-password-icon>visibility</span>
          </button>
        </div>
      </label>
      <label class="login-field">
        <span class="sr-only">Confirmar contraseña</span>
        <input type="password" id="resetPassword2" name="resetPassword2" autocomplete="new-password" minlength="8" placeholder="Confirmar contraseña"/>
      </label>
      <p id="resetError" class="login-error hidden" role="alert"></p>
      <button type="submit" class="login-submit" id="btnResetPassword">
        <span>Guardar contraseña</span>
      </button>
      <button type="button" class="login-text-btn" id="btnBackLogin">Volver</button>
    </form>
  </section>
</main>
<script src="/js/auth-client.js"></script>
<script src="/js/login.js?v=3"></script>
</body>
</html>
