<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Asistente IA | BALDERRAMA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="/css/dashboard.css?v=14" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="dashboard-body" data-page="assistant">
<aside id="sidebar"></aside>
<main class="main-shell assistant-shell">
<header class="top-bar">
<div class="top-bar-actions">
<span class="top-bar-title">Asistente IA</span>
<span id="aiStatusBadge" class="top-bar-meta">Verificando…</span>
</div>
<div class="top-bar-actions">
<button type="button" id="btnClearChat" class="btn-glass btn-secondary btn-sm">
<span class="material-symbols-outlined">delete_sweep</span>
Nueva conversación
</button>
</div>
</header>

<div class="assistant-layout">
<section class="assistant-hero section-panel">
<div class="assistant-hero__icon">
<span class="material-symbols-outlined">psychology</span>
</div>
<div>
<h1 class="assistant-hero__title">Analista BALDERRAMA</h1>
<p class="assistant-hero__desc">
Consulta ventas, inventario, contabilidad, post-venta y pronósticos. Pide comparativos, tendencias y análisis en lenguaje natural.
</p>
</div>
</section>

<div id="suggestedPrompts" class="assistant-suggestions">
<button type="button" class="chip" data-prompt="¿Cuántas ventas retail vs flotilla hubo este mes?">Ventas del mes</button>
<button type="button" class="chip" data-prompt="¿Quiénes son los 5 vendedores con más unidades en el año?">Top vendedores YTD</button>
<button type="button" class="chip" data-prompt="Dame un resumen ejecutivo del trimestre actual con hallazgos clave.">Resumen trimestral</button>
<button type="button" class="chip" data-prompt="¿Cómo va el inventario y el plan piso?">Inventario</button>
<button type="button" class="chip" data-prompt="Analiza el desempeño de post-venta del último mes.">Post-venta</button>
</div>

<div id="chatMessages" class="assistant-chat custom-scrollbar"></div>

<form id="chatForm" class="assistant-composer section-panel">
<div class="assistant-composer__inner">
<textarea id="chatInput" class="assistant-input" rows="1" placeholder="Pregunta sobre ventas, inventario, contabilidad, post-venta…" maxlength="4000"></textarea>
<button type="submit" id="btnSend" class="btn-glass btn-primary assistant-send" disabled>
<span class="material-symbols-outlined">send</span>
</button>
</div>
<p class="assistant-hint">El asistente consulta datos reales de GMOFARRIL. Las respuestas pueden tardar unos segundos.</p>
</form>
</div>
</main>

<script src="/js/sidebar.js"></script>
<script src="/js/mobile-nav.js"></script>
<script src="/js/assistant.js?v=2"></script>
</body>
</html>
